list_execution_order:
- list1
- list2
short_circuit: false
color_rules:
  list1_any_hit: red
  list2_clear_match: red
  list2_possible_match: yellow
  judgment_item_default: yellow
  unreadable_or_uncertain: yellow
  aggregation: worst_color_wins
list1:
- id: L1-1
  text: Anything classified for national defense or foreign policy reasons
  source_pages:
  - 1
  category: Classified information
  examples: 'Classification markings; details that together could reveal something
    classified Example classification markings: (C) (S) (TS) (CUI) It doesn’t matter
    if there is more to the marking, it would still mark as a red flag. Ex: (S//NF/PROPIN)
    (C//FRD) (//GBR S) (TS//SI/TK) (S//RD) (S//REL) (TS//REL TO USA, AUS, CAN, GBR)
    (S//RD-N)'
  detectors:
  - kind: regex
    name: Classification portion marking
    item_id: L1-1
    pattern: \((?:TS|CUI|S|C)(?:\s*//[^)\r\n]{0,160})?\)|\(//[A-Z]{3}\s+(?:TS|S|C)(?://[^)\r\n]{0,160})?\)
    terms: []
    case_sensitive: false
    guard: classification_marking
    context_pattern: null
    context_scope: unit
  - kind: regex
    name: Classification or control banner
    item_id: L1-1
    pattern: \b(?:TOP\s+SECRET|SECRET|CONFIDENTIAL|CUI|FOUO|CONTROLLED\s+UNCLASSIFIED\s+INFORMATION|FOR\s+OFFICIAL\s+USE\s+ONLY)\b
    terms: []
    case_sensitive: true
    guard: none
    context_pattern: null
    context_scope: unit
  - kind: regex
    name: Contextual official-topic paraphrase 1
    item_id: L1-1
    pattern: \bclassified\s+(?:assessment|information|system|capabilit\w*)\b
    terms: []
    case_sensitive: false
    guard: none
    context_pattern: null
    context_scope: unit
