# Official wording preserved. Engineering detectors contain no test-derived hints or exemplars.
policy_version: LOE2-guide-v2-E1
source_document: docs/official-lists.pdf
source_sha256: ef7162e06e90663b9ad584f98961c2dc541b29cf6590b13e4b1ff5fd3536a681
list_execution_order:
- list1
- list2
short_circuit: false
color_rules:
  list1_any_hit: red
  list2_clear_match: red
  list2_possible_match: yellow
  judgment_item_default: yellow
  unreadable_or_uncertain: yellow
  aggregation: worst_color_wins
list1:
- id: L1-1
  category: Classified information
  text: Anything classified for national defense or foreign policy reasons
  examples: 'Classification markings; details that together could reveal something classified Example
    classification markings: (C) (S) (TS) (CUI) It doesn’t matter if there is more to the marking, it
    would still mark as a red flag. Ex: (S//NF/PROPIN) (C//FRD) (//GBR S) (TS//SI/TK) (S//RD) (S//REL)
    (TS//REL TO USA, AUS, CAN, GBR) (S//RD-N)'
  source_pages:
  - 1
  detectors:
  - kind: regex
    name: Classification portion marking
    item_id: L1-1
    pattern: \((?:TS|CUI|S|C)(?:\s*//[^)\r\n]{0,160})?\)|\(//[A-Z]{3}\s+(?:TS|S|C)(?://[^)\r\n]{0,160})?\)
    guard: classification_marking
  - kind: regex
    name: Classification or control banner
    item_id: L1-1
    pattern: \b(?:TOP\s+SECRET|SECRET|CONFIDENTIAL|CUI|FOUO|CONTROLLED\s+UNCLASSIFIED\s+INFORMATION|FOR\s+OFFICIAL\s+USE\s+ONLY)\b
    case_sensitive: true
- id: L1-3
  category: Protected by another law
  text: Information a different law says must be withheld
  examples: Names, ranks, and duty details of personnel currently in overseas, sensitive, or routinely
    deployed units; sensitive information from foreign governments; critical infrastructure security details
    (specifics about a particular locations defensive posture, etc.)
  source_pages:
  - 1
  detectors:
  - kind: keywords
    name: Protected personnel or foreign-government detail
    item_id: L1-3
    terms:
    - personnel currently in overseas
    - sensitive information from foreign governments
    - critical infrastructure security details
  - kind: regex
    name: Sensitive personnel context
    item_id: L1-3
    pattern: \b(?:names?|ranks?|duty\s+details?|personnel)\b.{0,120}\b(?:overseas|sensitive\s+units?|routinely\s+deployed|foreign\s+government)\b
  - kind: regex
    name: Specific infrastructure defense context
    item_id: L1-3
    pattern: \b(?:critical\s+infrastructure|base|facility|installation|location)\b.{0,120}\b(?:security\s+(?:details|plans)|defensive\s+posture|security\s+vulnerabilit(?:y|ies))\b
- id: L1-4
  category: Business secrets
  text: Trade secrets and confidential company financial or commercial information
  examples: Future contractor bids and proposals, contract financials, technical data a company was paid
    to develop
  source_pages:
  - 1
  detectors:
  - kind: keywords
    name: Business confidentiality indicator
    item_id: L1-4
    terms:
    - trade secret
    - trade secrets
    - confidential company financial
    - confidential commercial
    - contractor bid
    - contractor bids
    - contractor proposal
    - contractor proposals
    - contract financials
    - proprietary technical data
  - kind: regex
    name: Nonpublic bid or company-data context
    item_id: L1-4
    pattern: \b(?:confidential|proprietary|non[- ]public|future)\b.{0,100}\b(?:bids?|proposals?|(?:company|contract)\s+(?:financials?|technical\s+data|pricing))\b
  - kind: regex
    name: Company-paid technical data
    item_id: L1-4
    pattern: \btechnical\s+data\b.{0,100}\b(?:company|contractor)\b.{0,40}\bpaid\b
- id: L1-5
  category: Internal deliberations and legal advice
  text: Drafts, advice, and discussions that happen before a decision, and communications with lawyers
  examples: Sources that include draft documents, attorney advice, ongoing safety investigation material
  source_pages:
  - 1
  detectors:
  - kind: keywords
    name: Internal deliberation or legal-advice indicator
    item_id: L1-5
    terms:
    - predecisional
    - pre-decisional
    - attorney advice
    - legal advice
    - attorney-client
    - attorney client
    - ongoing safety investigation
    - communications with lawyers
  - kind: regex
    name: Draft document indicator
    item_id: L1-5
    pattern: \b(?:drafts?\s+(?:documents?|reports?|memorand(?:a|ums?)|memos?|polic(?:y|ies)|decisions?|recommendations?|proposals?)|(?:document|report|memo|policy)\s+draft)\b
  - kind: regex
    name: Before-decision discussion context
    item_id: L1-5
    pattern: \b(?:advice|discussions?|deliberations?)\b.{0,100}\bbefore\s+(?:a|the)\s+decision\b
- id: L1-6
  category: Personal privacy
  text: Personal details that would be an unwarranted invasion of privacy
  examples: Home addresses, personal phone numbers and emails, spouse/kid’s names and personal medical
    information
  source_pages:
  - 1
  detectors:
  - kind: regex
    name: Personal email-address format
    item_id: L1-6
    pattern: (?<![\w@])[A-Z0-9.!#$%&\x27*+/=?^_`{|}~-]+@[A-Z0-9-]+(?:\.[A-Z0-9-]+)+(?![\w@])
  - kind: regex
    name: Social Security number format
    item_id: L1-6
    pattern: (?<!\d)(?!000|666|9\d\d)\d{3}[- ](?!00)\d{2}[- ](?!0000)\d{4}(?!\d)
  - kind: regex
    name: Telephone-number format
    item_id: L1-6
    pattern: (?<!\w)(?:\+?1[ .-]?)?(?:\(\d{3}\)\s*|\d{3}[ .-])\d{3}[ .-]\d{4}(?!\d)
  - kind: regex
    name: International telephone-number format
    item_id: L1-6
    pattern: (?<!\w)\+\d{1,3}(?:[ .-]\d{2,5}){2,4}(?!\d)
  - kind: regex
    name: Street-address format
    item_id: L1-6
    pattern: \b\d{1,6}\s+(?:[A-Z0-9][\w.\x27-]*\s+){1,6}(?:Street|St|Road|Rd|Avenue|Ave|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl|Circle|Cir)\b
  - kind: regex
    name: Named family-member context
    item_id: L1-6
    pattern: \b(?:my|our)\s+(?:wife|husband|spouse|son|daughter|child|children|kids?)\s+(?:named\s+)?(?-i:[A-Z][A-Za-z\x27-]{1,})\b
  - kind: regex
    name: Medical detail near acknowledgments
    item_id: L1-6
    pattern: \b(?:medical\s+(?:information|history|condition)|diagnos(?:is|es|ed)|surger(?:y|ies)|treatment|illness|hospitali[sz]ation|cancer)\b
    guard: acknowledgment
    context_scope: nearby
    context_pattern: \b(?:acknowledg(?:e)?ments?|thank(?:s|ful)?|grateful)\b
  - kind: keywords
    name: Explicit personal-information label
    item_id: L1-6
    terms:
    - home address
    - home addresses
    - personal phone number
    - personal phone numbers
    - personal email
    - personal emails
    - personal medical information
